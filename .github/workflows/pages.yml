name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p _site/hanasaka_jisan_ash_game
          cp index.html _site/
          cp -R mukashi_party_battle _site/
          cp -R hanasaka_jisan_ash_game/docs _site/hanasaka_jisan_ash_game/
          touch _site/.nojekyll
          test -f _site/mukashi_party_battle/index.html
          test -f _site/mukashi_party_battle/main.js
          test -f _site/hanasaka_jisan_ash_game/docs/index.html
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
