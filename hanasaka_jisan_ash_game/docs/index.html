<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>花咲じいさん - 灰まきゲーム</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: linear-gradient(to bottom, #87CEEB 0%, #E0F6FF 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Hiragino Sans', 'Meiryo', sans-serif;
            overflow: hidden;
        }
        #gameContainer {
            position: relative;
            touch-action: none;
        }
        #gameCanvas {
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            cursor: crosshair;
        }
        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            text-shadow: 1px 1px 2px white;
        }
        #result {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,255,255,0.95);
            padding: 30px 50px;
            border-radius: 15px;
            text-align: center;
            display: none;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }
        #result h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        #result p {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }
        #retryBtn {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 12px 30px;
            font-size: 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.3s;
        }
        #retryBtn:hover {
            background: #45a049;
        }
        #instruction {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 14px;
            color: #555;
            text-shadow: 1px 1px 2px white;
        }
        #gameContainer { width: min(800px, 100vw, calc(100dvh * 4 / 3)); }
        #gameCanvas { display: block; width: 100%; height: auto; }
        #ui { font-size: clamp(12px, 2.5vw, 20px); pointer-events: none; }
        #instruction { width: 100%; text-align: center; font-size: clamp(10px, 2vw, 14px); pointer-events: none; }
        #result { width: min(90%, 420px); padding: 20px; }
        #result h2 { font-size: clamp(18px, 4vw, 28px); }
        #result p { white-space: pre-line; }
        .back-link { position: fixed; top: 8px; left: 10px; z-index: 2; background: #fffdf4e8; color: #263c34; padding: 4px 10px; border-radius: 5px; font-size: 12px; text-decoration: none; }
        body { background: #f5f1e8; color: #263c34; }
        #gameCanvas { box-shadow: 0 15px 60px #263c3420; }
        #ui { top: 20px; left: 20px; right: 20px; color: #263c34; font-size: clamp(12px,2.4vw,18px); }
        #result { z-index: 3; border: 1px solid #d9dccb; background: #fffdf4f5; }
        #retryBtn, #startBtn, #finishBtn { background: #ae4a38; border: 0; border-radius: 8px; color: white; padding: 12px 22px; cursor: pointer; font: inherit; }
        #welcome { position: absolute; inset: 0; z-index: 4; display: grid; place-content: center; text-align: center; padding: 20px; background: #f5f1e8ed; border-radius: 8px; }
        #welcome h1 { font-family: serif; font-size: clamp(26px,5vw,42px); margin-bottom: 16px; }
        #welcome p { font-size: clamp(12px,2.5vw,18px); margin-bottom: 20px; line-height: 1.9; }
        #bloomMeter { position: absolute; top: 55px; left: 20px; right: 20px; height: 8px; width: calc(100% - 40px); accent-color: #ae4a38; }
        #finishBtn { position: absolute; right: 18px; bottom: 35px; font-size: clamp(11px,2vw,15px); }
        #instruction { bottom: 10px; color: #263c34; }
        button:focus-visible, a:focus-visible { outline: 3px solid #263c34; outline-offset: 3px; }
    </style>
</head>
<body>
    <a class="back-link" href="../../">← ゲーム一覧</a>
    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="600"></canvas>
        <div id="welcome"><h1>枯れ木に、春を。</h1><p>木の上をクリック・タップで灰をまこう。<br>1回で3個。木に当たった灰が10〜20個で成功！<br>ちょうどよく咲いたら「できあがり」を押そう。</p><button id="startBtn">灰まきをはじめる</button></div>
        <meter id="bloomMeter" min="0" max="21" low="10" high="20" optimum="15" value="0" aria-label="木に当たった灰の数"></meter>
        <button id="finishBtn" hidden>できあがり！</button>
        <div id="ui">
            <span id="timer">残り時間: 30秒</span>
            <span id="ashCount">灰: 0個</span>
        </div>
        <div id="result">
            <h2 id="resultTitle"></h2>
            <p id="resultMessage"></p>
            <button id="retryBtn">もう一度遊ぶ</button>
        </div>
        <div id="instruction">クリック/タップで灰をまこう！（10〜20個で「できあがり」）</div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const timerEl = document.getElementById('timer');
        const ashCountEl = document.getElementById('ashCount');
        const resultEl = document.getElementById('result');
        const resultTitle = document.getElementById('resultTitle');
        const resultMessage = document.getElementById('resultMessage');
        const retryBtn = document.getElementById('retryBtn');

        // ゲーム設定
        const GAME_TIME = 30;
        const MIN_ASH = 10;
        const MAX_ASH = 20;

        // ゲーム状態
        let gameRunning = false;
        let timeLeft = GAME_TIME;
        let ashOnTree = 0;
        let ashes = [];
        let particles = [];
        let treeBloom = 0;
        let lastTime = 0;
        let simulationStep = 1;
        let frameId = null;
        let settling = false;
        let settleTime = 0;
        let best = 0;
        try { best = Number(localStorage.getItem('hanasaka-best')) || 0; } catch {}
        const finishBtn = document.getElementById('finishBtn');
        const meter = document.getElementById('bloomMeter');

        // 木の位置とサイズ
        const tree = {
            x: 400,
            y: 450,
            trunkWidth: 40,
            trunkHeight: 150,
            crownRadius: 120
        };

        // 灰クラス
        class Ash {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vy = 2 + Math.random() * 2;
                this.vx = (Math.random() - 0.5) * 2;
                this.size = 4 + Math.random() * 4;
                this.alpha = 1;
                this.counted = false;
            }

            update() {
                this.x += this.vx * simulationStep;
                this.y += this.vy * simulationStep;
                this.vy += 0.1 * simulationStep; // 重力
                this.vx *= Math.pow(0.99, simulationStep); // 空気抵抗

                // 木との当たり判定
                if (!this.counted) {
                    const dx = this.x - tree.x;
                    const dy = this.y - (tree.y - tree.trunkHeight - 30);
                    const dist = Math.sqrt(dx * dx + dy * dy);

                    if (dist < tree.crownRadius + this.size) {
                        this.counted = true;
                        ashOnTree++;
                        // パーティクル生成
                        for (let i = 0; i < 5; i++) {
                            particles.push(new Particle(this.x, this.y));
                        }
                        return false;
                    }
                }

                // 画面外チェック
                return this.y < canvas.height + 50;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(128, 128, 128, ${this.alpha})`;
                ctx.fill();
            }
        }

        // パーティクルクラス（灰が当たった時のエフェクト）
        class Particle {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                this.vx = (Math.random() - 0.5) * 4;
                this.vy = (Math.random() - 0.5) * 4;
                this.life = 1;
                this.color = Math.random() > 0.5 ? '#FFB7C5' : '#FFC0CB';
            }

            update() {
                this.x += this.vx * simulationStep;
                this.y += this.vy * simulationStep;
                this.life -= 0.02 * simulationStep;
                return this.life > 0;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, 3, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.globalAlpha = this.life;
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        // 木を描画
        function drawTree() {
            // 幹
            ctx.fillStyle = '#8B4513';
            ctx.fillRect(
                tree.x - tree.trunkWidth / 2,
                tree.y - tree.trunkHeight,
                tree.trunkWidth,
                tree.trunkHeight
            );

            // 枝（装飾）
            ctx.strokeStyle = '#8B4513';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(tree.x - 10, tree.y - tree.trunkHeight + 30);
            ctx.lineTo(tree.x - 50, tree.y - tree.trunkHeight - 20);
            ctx.stroke();
            ctx.beginPath();
            ctx.moveTo(tree.x + 10, tree.y - tree.trunkHeight + 50);
            ctx.lineTo(tree.x + 60, tree.y - tree.trunkHeight);
            ctx.stroke();

            // 樹冠（灰の量に応じて色が変わる）
            const bloomProgress = Math.min(ashOnTree / MIN_ASH, 1);
            const overBloom = ashOnTree > MAX_ASH;

            let crownColor;
            if (overBloom) {
                // 灰が多すぎる - 茶色っぽく
                crownColor = '#A0522D';
            } else if (bloomProgress >= 1) {
                // 満開 - ピンク
                crownColor = '#FFB7C5';
            } else {
                // 徐々にピンクに
                const r = Math.floor(139 + (255 - 139) * bloomProgress);
                const g = Math.floor(90 + (183 - 90) * bloomProgress);
                const b = Math.floor(43 + (197 - 43) * bloomProgress);
                crownColor = `rgb(${r}, ${g}, ${b})`;
            }

            ctx.beginPath();
            ctx.arc(tree.x, tree.y - tree.trunkHeight - 30, tree.crownRadius, 0, Math.PI * 2);
            ctx.fillStyle = crownColor;
            ctx.fill();

            // 桜の花びら（開花時）
            if (bloomProgress > 0.5 && !overBloom) {
                const flowerCount = Math.floor(bloomProgress * 30);
                for (let i = 0; i < flowerCount; i++) {
                    const angle = (i / flowerCount) * Math.PI * 2;
                    const r = tree.crownRadius * 0.7 * (0.25 + ((i * 0.618) % 0.75));
                    const fx = tree.x + Math.cos(angle) * r;
                    const fy = tree.y - tree.trunkHeight - 30 + Math.sin(angle) * r;

                    ctx.beginPath();
                    ctx.arc(fx, fy, 5, 0, Math.PI * 2);
                    ctx.fillStyle = '#FFF0F5';
                    ctx.fill();
                }
            }
        }

        // 地面を描画
        function drawGround() {
            ctx.fillStyle = '#9aaf82';
            ctx.fillRect(0, tree.y, canvas.width, canvas.height - tree.y);

            // 草のテクスチャ
            ctx.fillStyle = '#829b70';
            for (let i = 0; i < canvas.width; i += 20) {
                const h = 5 + (Math.sin(i * 2.4) + 1) * 5;
                ctx.fillRect(i, tree.y - h, 3, h);
            }
        }

        // おじいさんを描画
        function drawJisan() {
            const jx = 150;
            const jy = tree.y - 10;

            // 体
            ctx.fillStyle = '#718e85';
            ctx.beginPath();
            ctx.ellipse(jx, jy - 40, 25, 35, 0, 0, Math.PI * 2);
            ctx.fill();

            // 頭
            ctx.fillStyle = '#FFDAB9';
            ctx.beginPath();
            ctx.arc(jx, jy - 90, 25, 0, Math.PI * 2);
            ctx.fill();

            // 髪（白髪）
            ctx.fillStyle = '#DCDCDC';
            ctx.beginPath();
            ctx.arc(jx, jy - 100, 20, Math.PI, 0);
            ctx.fill();

            // 目
            ctx.fillStyle = '#000';
            ctx.beginPath();
            ctx.arc(jx - 8, jy - 92, 3, 0, Math.PI * 2);
            ctx.arc(jx + 8, jy - 92, 3, 0, Math.PI * 2);
            ctx.fill();

            // 笑顔
            ctx.strokeStyle = '#000';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.arc(jx, jy - 85, 10, 0.2, Math.PI - 0.2);
            ctx.stroke();

            // 腕（灰をまくポーズ）
            ctx.strokeStyle = '#FFDAB9';
            ctx.lineWidth = 8;
            ctx.beginPath();
            ctx.moveTo(jx + 20, jy - 50);
            ctx.lineTo(jx + 60, jy - 80);
            ctx.stroke();

            // 灰袋
            ctx.fillStyle = '#D2B48C';
            ctx.beginPath();
            ctx.ellipse(jx - 30, jy - 30, 15, 20, -0.3, 0, Math.PI * 2);
            ctx.fill();
        }

        // 背景を描画
        function drawBackground() {
            // 空のグラデーション
            const gradient = ctx.createLinearGradient(0, 0, 0, canvas.height);
            gradient.addColorStop(0, '#c6d9cf');
            gradient.addColorStop(1, '#f3edd9');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // 雲
            ctx.fillStyle = 'rgba(255, 255, 255, 0.8)';
            drawCloud(100, 80, 50);
            drawCloud(600, 120, 40);
            drawCloud(350, 60, 35);
        }

        function drawCloud(x, y, size) {
            ctx.beginPath();
            ctx.arc(x, y, size, 0, Math.PI * 2);
            ctx.arc(x + size * 0.8, y - size * 0.2, size * 0.7, 0, Math.PI * 2);
            ctx.arc(x + size * 1.5, y, size * 0.8, 0, Math.PI * 2);
            ctx.fill();
        }

        // ゲームループ
        function gameLoop(timestamp) {
            if (!lastTime) lastTime = timestamp;
            const delta = Math.min(timestamp - lastTime, 50);
            simulationStep = delta / (1000 / 60);
            lastTime = timestamp;

            // 背景描画
            drawBackground();
            drawGround();
            drawTree();
            drawJisan();

            // 灰の更新と描画
            ashes = ashes.filter(ash => ash.update());
            ashes.forEach(ash => ash.draw());

            // パーティクルの更新と描画
            particles = particles.filter(p => p.update());
            particles.forEach(p => p.draw());

            // UI更新
            ashCountEl.textContent = `灰: ${ashOnTree}個`;

            meter.value = ashOnTree;
            if (gameRunning) {
                if (!settling) timeLeft = Math.max(0, timeLeft - delta / 1000);
                timerEl.textContent = settling ? '灰が落ちるのを待っています…' : '残り時間: ' + Math.ceil(timeLeft) + '秒';
                finishBtn.hidden = settling;
                if (timeLeft <= 0 && !settling) finish();
                if (settling) {
                    settleTime += delta;
                    if (ashes.length === 0 || settleTime > 4000) endGame();
                }
            }
            frameId = requestAnimationFrame(gameLoop);
        }

        function finish() {
            if (!gameRunning || settling) return;
            settling = true;
            settleTime = 0;
            finishBtn.hidden = true;
        }

        // ゲーム終了
        function endGame() {
            gameRunning = false;

            let title, message;

            if (ashOnTree >= MIN_ASH && ashOnTree <= MAX_ASH) {
                title = '🌸 大成功！🌸';
                message = `${ashOnTree}個の灰で枯れ木が満開の桜に！\nおじいさんも大喜び！`;
            } else if (ashOnTree < MIN_ASH) {
                title = '😢 残念...';
                message = `灰が足りませんでした（${ashOnTree}個）\n${MIN_ASH}個以上まきましょう`;
            } else {
                title = '😵 まきすぎ！';
                message = `灰をまきすぎました（${ashOnTree}個）\n${MAX_ASH}個以下に抑えましょう`;
            }

            const score = ashOnTree >= MIN_ASH && ashOnTree <= MAX_ASH ? Math.max(0, 100 - Math.abs(15 - ashOnTree) * 10) : 0;
            best = Math.max(best, score);
            try { localStorage.setItem('hanasaka-best', String(best)); } catch {}
            message += '\n開花点: ' + score + '点 ／ 自己ベスト: ' + best + '点';
            resultTitle.textContent = title;
            resultMessage.textContent = message;
            resultEl.style.display = 'block';
        }

        // 灰をまく
        function spawnAsh(x, y) {
            if (!gameRunning || settling) return;

            // クリック位置から複数の灰を生成
            for (let i = 0; i < 3; i++) {
                const offsetX = (Math.random() - 0.5) * 30;
                const offsetY = (Math.random() - 0.5) * 20;
                ashes.push(new Ash(x + offsetX, y + offsetY));
            }
        }

        // ゲーム開始
        function startGame() {
            if (frameId !== null) cancelAnimationFrame(frameId);
            settling = false;
            settleTime = 0;
            finishBtn.hidden = false;
            document.getElementById('welcome').hidden = true;
            document.getElementById('welcome').style.display = 'none';
            gameRunning = true;
            timeLeft = GAME_TIME;
            ashOnTree = 0;
            ashes = [];
            particles = [];
            lastTime = 0;

            resultEl.style.display = 'none';
            timerEl.textContent = `残り時間: ${timeLeft}秒`;
            ashCountEl.textContent = `灰: 0個`;

            frameId = requestAnimationFrame(gameLoop);
        }

        canvas.addEventListener('pointerdown', (e) => {
            e.preventDefault();
            const rect = canvas.getBoundingClientRect();
            spawnAsh((e.clientX - rect.left) * canvas.width / rect.width,
                     (e.clientY - rect.top) * canvas.height / rect.height);
        });
        retryBtn.addEventListener('click', startGame);
        document.getElementById('startBtn').addEventListener('click', startGame);
        finishBtn.addEventListener('click', finish);
        document.addEventListener('visibilitychange', () => { lastTime = 0; });
        drawBackground(); drawGround(); drawTree(); drawJisan();
    </script>
</body>
</html>
