<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>金太郎 vs クマ 相撲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #1a1a2e;
        }

        #unity-container {
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        #unity-canvas {
            width: 100%;
            height: 100%;
            max-width: 100vw;
            max-height: 100vh;
            background: #2a2a3e;
        }

        /* 縦画面基準でアスペクト比を維持 */
        @media (min-aspect-ratio: 9/16) {
            #unity-canvas {
                width: auto;
                height: 100vh;
                aspect-ratio: 9/16;
            }
        }

        @media (max-aspect-ratio: 9/16) {
            #unity-canvas {
                width: 100vw;
                height: auto;
                aspect-ratio: 9/16;
            }
        }

        #unity-loading-bar {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
        }

        #unity-progress-bar-empty {
            width: 200px;
            height: 20px;
            background: #333;
            border-radius: 10px;
            overflow: hidden;
        }

        #unity-progress-bar-full {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #ff6b6b, #ffd93d);
            transition: width 0.3s;
        }

        #unity-loading-text {
            color: #fff;
            font-family: sans-serif;
            margin-top: 10px;
        }

        .hidden {
            display: none !important;
        }

        /* iOS Safari対策 */
        @supports (-webkit-touch-callout: none) {
            #unity-canvas {
                height: -webkit-fill-available;
            }
        }
    </style>
</head>
<body>
    <div id="unity-container">
        <canvas id="unity-canvas" tabindex="-1"></canvas>
        <div id="unity-loading-bar">
            <div id="unity-progress-bar-empty">
                <div id="unity-progress-bar-full"></div>
            </div>
            <div id="unity-loading-text">Loading...</div>
        </div>
    </div>

    <script>
        var buildUrl = "Build";
        var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
        var config = {
            dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
            frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
            codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
            streamingAssetsUrl: "StreamingAssets",
            companyName: "{{{ COMPANY_NAME }}}",
            productName: "{{{ PRODUCT_NAME }}}",
            productVersion: "{{{ PRODUCT_VERSION }}}",
        };

        var container = document.querySelector("#unity-container");
        var canvas = document.querySelector("#unity-canvas");
        var loadingBar = document.querySelector("#unity-loading-bar");
        var progressBarFull = document.querySelector("#unity-progress-bar-full");
        var loadingText = document.querySelector("#unity-loading-text");

        // モバイルタッチ操作の最適化
        canvas.addEventListener("touchstart", function(e) {
            e.preventDefault();
        }, { passive: false });

        // フルスクリーン対応（モバイル以外）
        if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
            // モバイルではフルスクリーンAPI使わない
        } else {
            canvas.style.cursor = "pointer";
        }

        var script = document.createElement("script");
        script.src = loaderUrl;
        script.onload = () => {
            createUnityInstance(canvas, config, (progress) => {
                progressBarFull.style.width = 100 * progress + "%";
                loadingText.textContent = Math.round(100 * progress) + "%";
            }).then((unityInstance) => {
                loadingBar.classList.add("hidden");
                // フォーカスを設定
                canvas.focus();
            }).catch((message) => {
                loadingText.textContent = "Error: " + message;
                console.error(message);
            });
        };
        document.body.appendChild(script);

        // 画面回転時のリサイズ対応
        window.addEventListener("resize", function() {
            // Unity側で自動リサイズされる
        });

        // iOS Safari のアドレスバー対策
        function setViewportHeight() {
            let vh = window.innerHeight * 0.01;
            document.documentElement.style.setProperty('--vh', `${vh}px`);
        }
        setViewportHeight();
        window.addEventListener('resize', setViewportHeight);
    </script>
</body>
</html>
